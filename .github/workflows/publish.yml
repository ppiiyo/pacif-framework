name: Publish to PyPI

# Tag path: push vX.Y.Z → tests → GitHub Release → PyPI.
# Filename must remain publish.yml (PyPI trusted publisher).
# Environment must remain pypi.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Release and publish
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard workflow_dispatch to main only
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::workflow_dispatch is only allowed on main (got ${GITHUB_REF})"
            exit 1
          fi

      - name: Read package version without importing pacif_core
        id: ver
        run: |
          PKG=$(python -c "import runpy; print(runpy.run_path('pacif_core/_version.py')['__version__'])")
          echo "pkg=${PKG}" >> "$GITHUB_OUTPUT"
          echo "package version=${PKG}"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="${{ steps.ver.outputs.pkg }}"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pacif_core/_version.py __version__=$PKG"
            exit 1
          fi

      - name: Verify version is newer than latest tag (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          PKG="${{ steps.ver.outputs.pkg }}"
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          echo "package=$PKG latest_tag=${LATEST:-none}"
          if [ -n "$LATEST" ] && [ "$PKG" = "$LATEST" ]; then
            echo "::error::Package version $PKG already has tag v$LATEST. Bump _version.py before dispatch."
            exit 1
          fi

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check pacif_core tests examples

      - name: Typecheck (mypy)
        run: mypy pacif_core

      - name: Test (pytest)
        run: pytest tests/ -q

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent re-runs: do not fail if this exact file is already on PyPI
          skip-existing: true
          verbose: true
